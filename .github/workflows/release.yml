name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog notes
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk '/^## \[/{c++} c==1' CHANGELOG.md | tail -n +2)
          else
            NOTES=""
          fi
          {
            echo 'notes<<CHANGELOG_EOF'
            echo "$NOTES"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libpulse-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Run frontend tests
        run: pnpm test:run

      - name: Build Debian package
        run: pnpm build:deb

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check package
        run: node scripts/check-deb.mjs

      - name: Run release checks
        run: node scripts/check-release.mjs

      - name: Generate checksum
        run: |
          sha256sum src-tauri/target/release/bundle/deb/*.deb > checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zokute-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: ${{ steps.changelog.outputs.notes == '' }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            checksums.txt
